<!DOCTYPE html>
<html lang="en" class="h-full">

    <meta charset="UTF-8">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {

                    colors: {

        #direct-reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 1rem; }
    </style>
</head>

    <!-- Main Script -->
    <script>

                { id: 'u_asst1', name: 'Marcus (Assistant)', email: 'marcus@edupulse.com', role: 'assistant', pin: '1234' },

                { id: 'u_student2', name: 'Sophia Davis', email: 'sophia@edupulse.com', role: 'student', pin: '1234', qrCodeText: 'QR_SOPHIA_102', assistantId: 'u_asst1', groupId: 'g_1' },
                { id: 'u_student3', name: 'Noah Wilson', email: 'noah@edupulse.com', role: 'student', pin: '1234', qrCodeText: 'QR_NOAH_103', assistantId: 'u_asst2', groupId: 'g_2' }
            ],
            students: [
                { id: 'u_student1', name: 'Liam Smith', email: 'liam@edupulse.com', qrCodeText: 'QR_LIAM_101', assistantId: 'u_asst1', groupId: 'g_1', attendance: [{ date: '2026-11-10', status: 'Present' }] },
                { id: 'u_student2', name: 'Sophia Davis', email: 'sophia@edupulse.com', qrCodeText: 'QR_SOPHIA_102', assistantId: 'u_asst1', groupId: 'g_1', attendance: [{ date: '2026-11-10', status: 'Absent' }] },
                { id: 'u_student3', name: 'Noah Wilson', email: 'noah@edupulse.com', qrCodeText: 'QR_NOAH_103', assistantId: 'u_asst2', groupId: 'g_2', attendance: [{ date: '2026-11-10', status: 'Present' }] }

                { id: 'sub_1', homeworkId: 'hw_1', studentId: 'u_student1', studentName: 'Liam Smith', fileName: 'liam_calculus_hw.pdf', fileData: 'data:text/plain;base64,TGlhbSdzIENhbGN1bHVzIFNvbHV0aW9ucw==', status: 'Graded', score: '95/100', feedback: 'Excellent analytical work!' }
            ],

            ],

            ],

                { id: 'qs_1', quizId: 'qz_1', studentId: 'u_student1', studentName: 'Liam Smith', score: 18 },
                { id: 'qs_2', quizId: 'qz_1', studentId: 'u_student2', studentName: 'Sophia Davis', score: 7 }
            ],
            announcements: [
                { id: 'ann_1', title: 'Welcome to EduPulse Pro!', date: '2026-11-01', content: 'All students must ensure their QR attendance badges are saved on their phones.' }
            ]
        };

        function getDB() {
            try {
                const data = localStorage.getItem(DB_KEY);
                if (!data) {
                    localStorage.setItem(DB_KEY, JSON.stringify(defaultDatabase));
                    return defaultDatabase;
                }
                return JSON.parse(data);
            } catch (e) {
                return defaultDatabase;
            }
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderApp();
        }

        let currentUser = null;
        let activeTab = 'overview';
        let html5QrCodeObj = null;
        let isCameraActive = false;
        let lastScannedCode = '';
        let lastScanTime = 0;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center space-x-3 px-5 py-4 rounded-2xl shadow-2xl text-sm font-semibold text-white transition transform translate-y-2 opacity-0 border ${type === 'success' ? 'bg-emerald-950/95 border-emerald-500/50 text-emerald-300 shadow-emerald-500/20' : type === 'error' ? 'bg-rose-950/95 border-rose-500/50 text-rose-300 shadow-rose-500/20' : 'bg-amber-950/95 border-amber-500/50 text-amber-300 shadow-amber-500/20'}`;
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'error' ? 'fa-circle-xmark text-rose-400' : 'fa-circle-exclamation text-amber-400';
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginScreen();
                return;
            }

            // Stop camera before re-rendering DOM if we are leaving scanner tab
            if (activeTab !== 'scanner' && isCameraActive) {
                stopDirectScanner();
            }

            app.innerHTML = `
                <!-- Top Navigation Header -->
                <header class="glass-panel border-b border-slate-800 px-8 py-4 flex items-center justify-between z-20 shrink-0">
                    <div class="flex items-center space-x-4">
                        <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-3 rounded-2xl shadow-lg shadow-indigo-500/20 flex items-center justify-center">
                            <i class="fa-solid fa-graduation-cap text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-xl font-bold text-white tracking-wide flex items-center space-x-2">
                                <span>EduPulse</span>
                                <span class="text-xs px-2.5 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full font-semibold uppercase">${currentUser.role}</span>
                            </h1>
                            <p class="text-xs text-slate-400">Welcome back, <span class="text-slate-200 font-semibold">${currentUser.name}</span></p>
                        </div>
                    </div>
                </header>

                <!-- Main Layout -->
                <div class="flex-1 flex overflow-hidden">
                    <!-- Sidebar with Small Logout Button at Bottom -->
                    <aside class="w-72 glass-panel border-r border-slate-800 flex flex-col shrink-0">
                        <div class="p-5 space-y-2 flex-1 overflow-y-auto">
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-2">Main Navigation</p>
                            ${renderSidebarNav()}
                        </div>
                        <div class="p-4 border-t border-slate-800 flex items-center justify-between bg-slate-900/60">
                            <div class="flex items-center space-x-2 text-xs text-slate-400">
                                <span class="flex items-center text-emerald-400"><i class="fa-solid fa-circle text-[6px] mr-1.5 animate-ping"></i>Online</span>
                            </div>
                            <button onclick="logout()" class="text-xs bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-xl transition font-medium flex items-center space-x-1.5">
                                <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Viewport -->
                    <main class="flex-1 bg-slate-950 overflow-y-auto p-8 relative">
                        <div class="max-w-6xl mx-auto pb-12">
                            ${renderMainContent()}
                        </div>
                    </main>
                </div>
            `;

            if (currentUser.role === 'student' && activeTab === 'profile') {
                setTimeout(() => generateStudentQRCode(), 100);
            }
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950 via-slate-950 to-slate-950 p-6 overflow-y-auto">
                    <div class="glass-panel rounded-3xl shadow-2xl w-full max-w-md p-8 border border-slate-800">
                        <div class="text-center mb-8">
                            <div class="inline-flex bg-gradient-to-tr from-indigo-600 to-violet-600 text-white p-4 rounded-2xl shadow-xl shadow-indigo-600/30 mb-4">
                                <i class="fa-solid fa-graduation-cap text-3xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-white tracking-tight">EduPulse Pro</h2>
                            <p class="text-sm text-slate-400 mt-1">Smart School & Classroom Management</p>
                        </div>

                        <!-- Quick Demo Access -->
                        <div class="mb-6 space-y-2.5">
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Quick Demo Access</label>
                            <div class="grid grid-cols-2 gap-2.5">
                                <button onclick="loginAsDemo('u_admin')" class="bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 text-xs font-semibold p-3 rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-shield-halved"></i><span>Admin / Teacher</span>
                                </button>
                                <button onclick="loginAsDemo('u_asst1')" class="bg-sky-600/20 hover:bg-sky-600/30 border border-sky-500/30 text-sky-300 text-xs font-semibold p-3 rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-user-tie"></i><span>Assistant 1</span>
                                </button>
                                <button onclick="loginAsDemo('u_student1')" class="bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 text-xs font-semibold p-3 rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-user-graduate"></i><span>Student (Liam)</span>
                                </button>
                            </div>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
                                <input type="email" id="loginEmail" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition shadow-inner" placeholder="admin@edupulse.com">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1.5">Password / PIN</label>
                                <input type="password" id="loginPin" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition shadow-inner" placeholder="••••">
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/25 text-sm mt-2">
                                Sign In to Dashboard
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function loginAsDemo(userId) {
            const db = getDB();
            const found = db.users.find(u => u.id === userId);
            if (found) {
                currentUser = found;
                activeTab = getDefaultTabForRole(currentUser.role);
                renderApp();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const db = getDB();
            const found = db.users.find(u => u.email.toLowerCase() === email.toLowerCase() && (u.pin === pin || pin === '1234'));
            if (found) {
                currentUser = found;
                activeTab = getDefaultTabForRole(currentUser.role);
                renderApp();
            } else {
                alert('Invalid email or password/PIN.');
            }
        }

        function logout() {
            stopDirectScanner();
            currentUser = null;
            renderApp();
        }

        function getDefaultTabForRole(role) {
            if (role === 'admin') return 'overview';
            if (role === 'assistant') return 'scanner';
            if (role === 'student') return 'homework';
            return 'overview';
        }

        function renderSidebarNav() {
            const role = currentUser.role;
            let items = [];

            if (role === 'admin') {
                items = [
                    { id: 'overview', label: 'Admin Overview', icon: 'fa-chart-pie' },
                    { id: 'groups', label: 'Groups & Schedules', icon: 'fa-layer-group' },
                    { id: 'students', label: 'Student Management', icon: 'fa-users' },
                    { id: 'assistants', label: 'Assistant Roster', icon: 'fa-user-tie' },
                    { id: 'homework', label: 'Homework Manager', icon: 'fa-book-open' },
                    { id: 'resources', label: 'Lesson Resources & Notes', icon: 'fa-file-arrow-up' },
                    { id: 'quizzes', label: 'Quiz & Grades', icon: 'fa-clipboard-question' },
                    { id: 'announcements', label: 'Announcements', icon: 'fa-bullhorn' }
                ];
            } else if (role === 'assistant') {
                items = [
                    { id: 'scanner', label: 'QR Attendance Scanner', icon: 'fa-qrcode' },
                    { id: 'students', label: 'My Assigned Students', icon: 'fa-user-group' },
                    { id: 'homework', label: 'Homework & Submissions', icon: 'fa-file-pen' },
                    { id: 'quizzes', label: 'Quiz Scores & Marks', icon: 'fa-star' },
                    { id: 'announcements', label: 'Announcements', icon: 'fa-bullhorn' }
                ];
            } else if (role === 'student') {
                items = [
                    { id: 'homework', label: 'My Homework', icon: 'fa-book' },
                    { id: 'resources', label: 'Lesson Notes & Resources', icon: 'fa-folder-open' },
                    { id: 'announcements', label: 'Announcements', icon: 'fa-bullhorn' },
                    { id: 'schedule', label: 'My Group & Schedule', icon: 'fa-calendar-days' },
                    { id: 'quizzes', label: 'My Scores & Quizzes', icon: 'fa-square-poll-vertical' },
                    { id: 'profile', label: 'Profile & QR Badge', icon: 'fa-id-card' }
                ];
            }

            return items.map(item => `
                <button onclick="switchTab('${item.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition ${activeTab === item.id ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/25' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'}">
                    <i class="fa-solid ${item.icon} w-5 text-center"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            activeTab = tabId;
            renderApp();
        }

        function renderMainContent() {
            const role = currentUser.role;
            const db = getDB();
            if (role === 'admin') {
                if (activeTab === 'overview') return renderAdminOverview(db);
                if (activeTab === 'groups') return renderAdminGroups(db);
                if (activeTab === 'students') return renderAdminStudents(db);
                if (activeTab === 'assistants') return renderAdminAssistants(db);
                if (activeTab === 'homework') return renderAdminHomework(db);
                if (activeTab === 'resources') return renderAdminResources(db);
                if (activeTab === 'quizzes') return renderAdminQuizzes(db);
                if (activeTab === 'announcements') return renderAdminAnnouncements(db);
            } else if (role === 'assistant') {
                if (activeTab === 'scanner') return renderAssistantScanner(db);
                if (activeTab === 'students') return renderAssistantStudents(db);
                if (activeTab === 'homework') return renderAssistantHomework(db);
                if (activeTab === 'quizzes') return renderAssistantQuizzes(db);
                if (activeTab === 'announcements') return renderSharedAnnouncements(db);
            } else if (role === 'student') {
                if (activeTab === 'homework') return renderStudentHomework(db);
                if (activeTab === 'resources') return renderStudentResources(db);
                if (activeTab === 'announcements') return renderSharedAnnouncements(db);
                if (activeTab === 'schedule') return renderStudentSchedule(db);
                if (activeTab === 'quizzes') return renderStudentQuizzes(db);
                if (activeTab === 'profile') return renderStudentProfile(db);
            }
            return `<div class="text-slate-400">Select a tab from the sidebar.</div>`;
        }

        // --- ASSISTANT SCANNER VIEW (ONLY SCANNER & PRIVACY PROTECTED) ---
        function renderAssistantScanner(db) {
            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-white tracking-tight">Live QR Attendance Scanner</h2>
                        <p class="text-sm text-slate-400 mt-1">Scan any student's QR badge to record attendance instantly.</p>
                    </div>

                    <!-- Direct Camera Card -->
                    <div class="glass-panel p-8 rounded-3xl flex flex-col items-center border border-slate-800 shadow-2xl">
                        <div class="flex items-center justify-between w-full mb-5">
                            <span class="text-sm font-bold text-white flex items-center space-x-2">
                                <i class="fa-solid fa-camera text-indigo-400 mr-2"></i><span>Camera Feed</span>
                            </span>
                            <button onclick="toggleDirectScanner()" id="cameraControlBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center space-x-2">
                                <i class="fa-solid fa-video"></i><span>Open Camera</span>
                            </button>
                        </div>

                        <!-- Video Viewport -->
                        <div class="w-full max-w-md aspect-square rounded-3xl overflow-hidden border-2 border-dashed border-slate-700 bg-slate-900/90 relative flex items-center justify-center shadow-inner">
                            <div id="direct-reader" class="w-full h-full"></div>
                            <div id="cameraIdleOverlay" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-900/95">
                                <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mb-4">
                                    <i class="fa-solid fa-qrcode text-3xl"></i>
                                </div>
                                <h4 class="text-white font-bold text-sm">Camera is Currently Off</h4>
                                <p class="text-xs text-slate-400 mt-1.5 max-w-xs">Click "Open Camera" above and grant browser camera permission to start scanning.</p>
                            </div>
                        </div>

                        <!-- Manual Code Entry (Backup / Barcode Gun) -->
                        <form onsubmit="handleManualQrSubmit(event)" class="w-full max-w-md mt-6 pt-6 border-t border-slate-800/80">
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Or Enter Student QR Code Manually</label>
                            <div class="flex space-x-2">
                                <input type="text" id="manualQrInput" required placeholder="e.g. QR_LIAM_101" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-mono focus:outline-none focus:border-indigo-500">
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20">
                                    Submit
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function toggleDirectScanner() {
            if (isCameraActive) {
                await stopDirectScanner();
            } else {
                await startDirectScanner();
            }
        }

        async function startDirectScanner() {
            const overlay = document.getElementById('cameraIdleOverlay');
            const btn = document.getElementById('cameraControlBtn');

            try {
                if (!html5QrCodeObj) {
                    html5QrCodeObj = new Html5Qrcode("direct-reader");
                }

                if (btn) {
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Starting...</span>`;
                }

                await html5QrCodeObj.start(
                    { facingMode: "environment" },
                    {
                        fps: 15,
                        qrbox: { width: 220, height: 220 }
                    },
                    (decodedText) => {
                        processScannedQrCode(decodedText);
                    },
                    (errorMessage) => {
                        // Ignore continuous scan frame misses
                    }
                );

                isCameraActive = true;
                if (overlay) overlay.style.display = 'none';
                if (btn) {
                    btn.innerHTML = `<i class="fa-solid fa-video-slash"></i><span>Stop Camera</span>`;
                    btn.className = 'bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow-lg flex items-center space-x-2';
                }
            } catch (err) {
                console.error("Camera start failed:", err);
                showToast("Could not access camera. Please allow camera permissions or use the manual input below.", "error");
                if (btn) {
                    btn.innerHTML = `<i class="fa-solid fa-video"></i><span>Open Camera</span>`;
                }
            }
        }

        async function stopDirectScanner() {
            if (html5QrCodeObj && isCameraActive) {
                try {
                    await html5QrCodeObj.stop();
                    html5QrCodeObj.clear();
                } catch (e) {
                    console.log("Error stopping camera:", e);
                }
            }
            isCameraActive = false;
            const overlay = document.getElementById('cameraIdleOverlay');
            const btn = document.getElementById('cameraControlBtn');
            if (overlay) overlay.style.display = 'flex';
            if (btn) {
                btn.innerHTML = `<i class="fa-solid fa-video"></i><span>Open Camera</span>`;
                btn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center space-x-2';
            }
        }

        function handleManualQrSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('manualQrInput');
            if (input && input.value.trim()) {
                processScannedQrCode(input.value.trim());
                input.value = '';
            }
        }

        function processScannedQrCode(decodedText) {
            // Prevent rapid duplicate triggers within 3 seconds
            const now = Date.now();
            if (decodedText === lastScannedCode && (now - lastScanTime) < 3000) {
                return;
            }
            lastScannedCode = decodedText;
            lastScanTime = now;

            const db = getDB();
            let student = null;

            if (decodedText.startsWith('EDUPULSE_ID:')) {
                const parts = decodedText.split(':');
                student = db.students.find(s => s.id === parts[1]);
            } else {
                student = db.students.find(s => s.qrCodeText && s.qrCodeText.toLowerCase() === decodedText.trim().toLowerCase());
            }

            if (!student) {
                showToast(`⚠️ Unknown Student! QR Code "${decodedText}" is not registered.`, 'error');
                return;
            }

            if (!student.attendance) student.attendance = [];
            const today = new Date().toISOString().split('T')[0];

            const alreadyPresent = student.attendance.find(a => a.date === today && a.status === 'Present');
            if (alreadyPresent) {
                showToast(`ℹ️ ${student.name} is already marked Present today!`, 'warning');
                return;
            }

            student.attendance.push({ date: today, status: 'Present' });
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            showToast(`✅ QR code has scanned successfully! ${student.name} marked Present.`);
        }

        function handleAssistantAddQuizScore(e) {
            e.preventDefault();
            const studentId = document.getElementById('quizStudentId').value;
            const score = parseInt(document.getElementById('quizScoreVal').value);

            const db = getDB();
            const student = db.students.find(s => s.id === studentId);
            if (student) {
                db.quizScores.push({
                    id: 'qs_' + Date.now(),
                    quizId: 'qz_1',
                    studentId: student.id,
                    studentName: student.name,
                    score
                });
                closeModal();
                saveDB(db);
            }
        }

        // --- STUDENT VIEWS ---
        function renderStudentHomework(db) {
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white tracking-tight">My Homework & Submissions</h2>
                        <p class="text-sm text-slate-400">View tasks, replace/upload solutions before due date.</p>
                    </div>

                    <div class="space-y-4">
                        ${db.homework.map(hw => {
                            const existingSub = db.submissions.find(s => s.homeworkId === hw.id && s.studentId === currentUser.id);
                            const now = new Date();
                            const due = new Date(hw.dueDate);
                            const isExpired = now > due;

                            return `
                                <div class="glass-panel p-6 rounded-3xl space-y-4">
                                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                        <div>
                                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${hw.subject}</span>
                                            <h3 class="text-lg font-bold text-white mt-3">${hw.title}</h3>
                                            <p class="text-sm text-slate-300 mt-1">${hw.description}</p>
                                            <p class="text-xs text-slate-400 mt-2">Due Date: <strong class="${isExpired ? 'text-rose-400' : 'text-slate-200'}">${hw.dueDate}</strong> ${isExpired ? '(Expired)' : ''}</p>
                                        </div>
                                        <div>
                                            ${isExpired ? `
                                                <span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs px-4 py-2.5 rounded-xl font-semibold">Submission Closed (Due Date Passed)</span>
                                            ` : `
                                                <button onclick="openStudentSubmitModal('${hw.id}', '${hw.title}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-5 py-3 rounded-xl transition shadow-lg shadow-indigo-600/25">
                                                    ${existingSub ? 'Replace Homework File' : 'Submit Homework'}
                                                </button>
                                            `}
                                        </div>
                                    </div>
                                    ${existingSub ? `
                                        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex items-center justify-between text-xs">
                                            <div>
                                                <span class="text-emerald-400 font-bold block mb-1">✅ Submitted File: ${existingSub.fileName}</span>
                                                <span class="text-slate-400">Status: ${existingSub.status} • Score: <strong class="text-indigo-400">${existingSub.score}</strong></span>
                                            </div>
                                            <a href="${existingSub.fileData}" download="${existingSub.fileName}" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 px-3 py-1.5 rounded-xl font-medium transition">Download My File</a>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                <div id="modalContainer"></div>
            `;
        }

        function openStudentSubmitModal(hwId, title) {
            document.getElementById('modalContainer').innerHTML = `
                <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                    <div class="glass-panel rounded-3xl w-full max-w-md p-8 border border-slate-800 shadow-2xl">
                        <h3 class="text-xl font-bold text-white mb-2">Submit Homework</h3>
                        <p class="text-xs text-slate-400 mb-6">Upload your solved file for "${title}". You can replace it anytime before the due date.</p>
                        <form onsubmit="handleStudentSubmitFile(event, '${hwId}')" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-2">Select Solution File</label>
                                <input type="file" id="studSubFile" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-400 focus:outline-none">
                            </div>
                            <div class="flex justify-end space-x-3 pt-4">
                                <button type="button" onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition">Cancel</button>
                                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition">Upload & Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleStudentSubmitFile(e, hwId) {
            e.preventDefault();
            const fileInput = document.getElementById('studSubFile');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const fileData = event.target.result;
                const db = getDB();

                db.submissions = db.submissions.filter(s => !(s.homeworkId === hwId && s.studentId === currentUser.id));

                db.submissions.push({
                    id: 'sub_' + Date.now(),
                    homeworkId: hwId,
                    studentId: currentUser.id,
                    studentName: currentUser.name,
                    fileName: file.name,
                    fileData: fileData,
                    status: 'Submitted',
                    score: 'Pending',
                    feedback: 'Awaiting review.'
                });
                closeModal();
                saveDB(db);
                showToast('Homework submitted/replaced successfully!');
            };
            reader.readAsDataURL(file);
        }

        function renderStudentResources(db) {
            const studentRecord = db.students.find(s => s.id === currentUser.id) || {};
            const myResources = db.lessonResources.filter(r => r.groupId === studentRecord.groupId);
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white tracking-tight">Lesson Notes & Resources</h2>
                        <p class="text-sm text-slate-400">Download notes and materials uploaded by your teacher for your group.</p>
                    </div>

                    <div class="space-y-4">
                        ${myResources.length > 0 ? myResources.map(res => `
                            <div class="glass-panel p-6 rounded-3xl flex items-center justify-between">
                                <div class="space-y-1">
                                    <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-semibold">Lesson Material</span>
                                    <h3 class="text-lg font-bold text-white mt-2">${res.title}</h3>
                                    <p class="text-xs text-slate-400">Date: ${res.date} • File: <strong class="text-slate-200">${res.fileName}</strong></p>
                                </div>
                                <a href="#" onclick="showToast('Downloading ${res.fileName}...'); return false;" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-5 py-2.5 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/20 flex items-center space-x-2">
                                    <i class="fa-solid fa-download"></i><span>Download Notes</span>
                                </a>
                            </div>
                        `).join('') : '<div class="glass-panel p-8 rounded-3xl text-center text-slate-400">No lesson resources uploaded for your group yet.</div>'}
                    </div>
                </div>
            `;
        }

        function renderStudentSchedule(db) {
            const studentRecord = db.students.find(s => s.id === currentUser.id) || {};
            const grp = db.groups.find(g => g.id === studentRecord.groupId) || { name: 'General Group', time1: 'Saturday - 4:00 PM', time2: 'Tuesday - 4:00 PM' };
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white tracking-tight">My Group & Schedule</h2>
                        <p class="text-sm text-slate-400">Your assigned group and weekly session timings.</p>
                    </div>
                    <div class="glass-panel p-8 rounded-3xl space-y-4 max-w-xl">
                        <div class="flex items-center space-x-4">
                            <div class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 p-4 rounded-2xl"><i class="fa-solid fa-layer-group text-2xl"></i></div>
                            <div>
                                <h3 class="text-xl font-bold text-white">${grp.name}</h3>
                                <p class="text-xs text-slate-400 mt-0.5">Future International School - Hall A</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4 border-t border-slate-800 text-sm">
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                <span class="text-xs text-slate-400 block mb-1">First Session</span>
                                <strong class="text-white">${grp.time1}</strong>
                            </div>
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                                <span class="text-xs text-slate-400 block mb-1">Second Session</span>
                                <strong class="text-white">${grp.time2}</strong>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudentQuizzes(db) {
            const myScores = db.quizScores.filter(qs => qs.studentId === currentUser.id);
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white tracking-tight">My Quiz Scores</h2>
                        <p class="text-sm text-slate-400">Review your academic grades.</p>
                    </div>
                    <div class="glass-panel rounded-3xl p-6">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="text-xs uppercase text-slate-400 border-b border-slate-800">
                                <tr><th class="p-4">Quiz Title</th><th class="p-4">Score Achieved</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60">
                                ${myScores.length > 0 ? myScores.map(qs => `
                                    <tr>
                                        <td class="p-4 font-bold text-white">Physics Kinematics Quiz</td>
                                        <td class="p-4"><span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold px-3 py-1 rounded-xl">${qs.score} / 20</span></td>
                                    </tr>
                                `).join('') : `<tr><td colspan="2" class="p-6 text-center text-slate-400">No quiz scores recorded yet.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderStudentProfile(db) {
            const studentRecord = db.students.find(s => s.id === currentUser.id) || {};
            const grp = db.groups.find(g => g.id === studentRecord.groupId) || { name: 'General Group' };
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white tracking-tight">Profile & Attendance QR Badge</h2>
                        <p class="text-sm text-slate-400">Present this badge to your assistant for live check-in.</p>
                    </div>

                    <div class="glass-panel rounded-3xl p-8 max-w-md mx-auto text-center border border-slate-800 shadow-2xl">
                        <div class="bg-gradient-to-tr from-indigo-600 to-violet-600 text-white w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-3xl font-extrabold shadow-xl shadow-indigo-600/30 mb-5">
                            ${currentUser.name.charAt(0)}
                        </div>
                        <h3 class="text-2xl font-bold text-white">${currentUser.name}</h3>
                        <p class="text-xs text-slate-400 mt-1">${currentUser.email} • Group: <span class="text-indigo-400 font-semibold">${grp.name}</span></p>
                        <p class="text-xs text-slate-400 mt-0.5">Code: <span class="text-emerald-400 font-mono">${currentUser.qrCodeText || 'QR_CODE'}</span></p>

                        <div class="my-8 bg-white p-5 rounded-3xl inline-block shadow-2xl">
                            <div id="qrcode" class="flex justify-center"></div>
                        </div>

                        <p class="text-xs text-slate-400">Scan this code with the Assistant QR Scanner during class.</p>
                    </div>
                </div>
            `;
        }

        function generateStudentQRCode() {
            const container = document.getElementById('qrcode');
            if (container && currentUser) {
                container.innerHTML = '';
                new QRCode(container, {
                    text: currentUser.qrCodeText || ('EDUPULSE_ID:' + currentUser.id),
                    width: 170,
                    height: 170,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        function renderSharedAnnouncements(db) {
            return `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold text-white tracking-tight">Announcements</h2>
                        <p class="text-sm text-slate-400">Important notices from school administration.</p>
                    </div>

                    <div class="space-y-4">
                        ${db.announcements.map(ann => `
                            <div class="glass-panel p-6 rounded-3xl">
                                <div class="flex items-center justify-between mb-2">
                                    <h3 class="text-lg font-bold text-white">${ann.title}</h3>
                                    <span class="text-xs text-slate-400">${ann.date}</span>
                                </div>
                                <p class="text-sm text-slate-300">${ann.content}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
